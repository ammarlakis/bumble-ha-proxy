[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bumble-ha-proxy"
version = "0.1.0"
description = "ESPHome-compatible BLE proxy using Bumble and direct USB access"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = ["Development Status :: 3 - Alpha", "Operating System :: POSIX :: Linux"]
requires-python = ">=3.12"
dependencies = ["bumble==0.0.236", "aioesphomeapi==46.30.0"]
[project.urls]
Repository = "https://github.com/ammarlakis/bumble-ha-proxy"
Issues = "https://github.com/ammarlakis/bumble-ha-proxy/issues"

[project.scripts]
bumble-ha-proxy = "bumble_ha_proxy.server:main"
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.14"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
environments = ["sys_platform == 'linux'"]
